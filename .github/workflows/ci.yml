name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumen_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lumen_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm exec prisma generate
      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Unit and API tests with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
